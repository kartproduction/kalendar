name: Deploy web app
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get PDF library
        run: |
          npm install jspdf --no-audit --no-fund
          mkdir -p www/js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/jspdf.umd.min.js
      - name: Assemble web app
        run: |
          mkdir _site
          cp -r www/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
