name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project files
        run: |
          echo '{"name":"kalendar","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.kasign.kalendar","appName":"Kalendar by Kasign","webDir":"www"}' > capacitor.config.json
      - name: Install Capacitor and PDF library
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share jspdf
          npm install -D --no-audit --no-fund @capacitor/cli
          mkdir -p www/js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/jspdf.umd.min.js
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add save-to-phone support
        run: |
          D=android/app/src/main/java/com/kasign/kalendar
          mkdir -p $D
          cat > $D/SaveBridge.java <<'EOF'
          package com.kasign.kalendar;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import java.io.OutputStream;

          public class SaveBridge {
            private final Context ctx;
            public SaveBridge(Context c) { ctx = c; }

            @JavascriptInterface
            public String save(String name, String mime, String b64) {
              try {
                if (Build.VERSION.SDK_INT < 29) return "error:Android 10 or newer is required";
                byte[] data = Base64.decode(b64, Base64.DEFAULT);
                boolean img = mime.startsWith("image/");
                String folder = (img ? Environment.DIRECTORY_PICTURES : Environment.DIRECTORY_DOWNLOADS) + "/Kalendar";
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, folder);
                Uri base = img
                  ? MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                  : MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                ContentResolver r = ctx.getContentResolver();
                Uri uri = r.insert(base, v);
                if (uri == null) return "error:could not create the file";
                OutputStream o = r.openOutputStream(uri);
                if (o == null) return "error:could not open the file";
                try { o.write(data); } finally { o.close(); }
                return "ok:" + folder;
              } catch (Exception e) {
                return "error:" + e.getMessage();
              }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.kasign.kalendar;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new SaveBridge(this), "KalendarSave");
            }
          }
          EOF
      - name: Set version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Kalendar.apk aligned.apk
          "$BT/apksigner" verify --print-certs Kalendar.apk
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalendar-APK
          path: Kalendar.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kalendar v1.0.${{ github.run_number }}
          files: Kalendar.apk
