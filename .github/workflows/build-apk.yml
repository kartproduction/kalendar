name: Build APK
# Run it from the Actions tab: "Build APK" > "Run workflow" (green button). Do NOT use "Re-run" on an old run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show what is being built
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $(git rev-parse --short HEAD) - $(git log -1 --format=%s)"
          grep -q 'id="live"' www/index.html || { echo "ERROR: www/index.html on this branch is the OLD page"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: bash scripts/ci-android.sh
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug
      - name: Name and verify the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kalendar-v1.0.${{ github.run_number }}.apk
          unzip -p Kalendar-v1.0.${{ github.run_number }}.apk assets/public/index.html | grep -q "$BUILD" || { echo "ERROR: the APK does not contain the new page"; exit 1; }
          echo "APK verified: $BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: Kalendar-APK
          path: Kalendar-v1.0.${{ github.run_number }}.apk
      - name: Publish to Releases (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kalendar v1.0.${{ github.run_number }}
          make_latest: true
          files: Kalendar-v1.0.${{ github.run_number }}.apk
