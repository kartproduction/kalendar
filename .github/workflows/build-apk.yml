            mkdir -p "$R/mipmap-$d"
            "$IM" "$SRC" -resize ${a}x${a} "$R/mipmap-$d/ic_launcher.png"
            "$IM" "$SRC" -resize ${a}x${a} "$R/mipmap-$d/ic_launcher_round.png"
