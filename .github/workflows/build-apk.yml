name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project files
        run: |
          echo '{"name":"kalendar","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.kasign.kalendar","appName":"Kalendar by Kasign","webDir":"www"}' > capacitor.config.json
      - name: Install Capacitor and PDF library
        run: |
          npm install --no-audit --no-fund @capacitor/core jspdf
          V=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          echo "Using Capacitor major version $V for every Capacitor package"
          npm install --no-audit --no-fund "@capacitor/android@$V"
          npm install -D --no-audit --no-fund "@capacitor/cli@$V"
          for P in filesystem share local-notifications; do
            npm install --no-audit --no-fund "@capacitor/$P@$V" || npm install --no-audit --no-fund "@capacitor/$P"
          done
          npm ls --depth=0 | grep -i capacitor || true
          mkdir -p www/js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/jspdf.umd.min.js
      - name: Stamp the page with the build number
        run: |
          B="build-${{ github.run_number }}-${GITHUB_SHA::7}"
          echo "BUILD=$B" >> "$GITHUB_ENV"
          if grep -q "__BUILD__" www/index.html; then
            sed -i "s/__BUILD__/$B/g" www/index.html
            echo "STAMPED=yes" >> "$GITHUB_ENV"
          else
            echo "No build stamp line in www/index.html (older page), skipping the stamp and the stamp check."
            echo "STAMPED=no" >> "$GITHUB_ENV"
          fi
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Put the app icon into the Android project
        run: |
          set -e
          mkdir -p /tmp/icon
          # Built-in icon, so the app never keeps the default Capacitor icon
          base64 -d > /tmp/icon/default.png <<'B64A'
