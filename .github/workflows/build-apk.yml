name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project files
        run: |
          echo '{"name":"kalendar","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.kasign.kalendar","appName":"Kalendar by Kasign","webDir":"www"}' > capacitor.config.json
      - name: Install Capacitor and PDF library
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share jspdf
          npm install -D --no-audit --no-fund @capacitor/cli
          mkdir -p www/js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/jspdf.umd.min.js
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kalendar-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalendar-APK
          path: Kalendar-v1.0.${{ github.run_number }}.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kalendar v1.0.${{ github.run_number }}
          files: Kalendar-v1.0.${{ github.run_number }}.apk
